<style>

absolute;inset:0;transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .5s}.image video{opacity:0}.card:hover .image video,.card.playing .image video{opacity:1}.card:hover .image img{transform:scale(1.025)}.card[data-slug="xuliang-special-appearance"] .image video{object-fit:contain}.image:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 60%,#0007);pointer-events:none}.tag{position:absolute;top:20px;left:22px;background:#171819bf;padding:8px 10px;z-index:1}.open{position:absolute;right:22px;bottom:22px;border:1px solid #ffffff66;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-size:24px;z-index:1;transition:background .25s,color .25s,transform .3s}.card:hover .open{background:var(--orange);border-color:var(--orange);transform:rotate(-45deg)}.caption{padding:18px 0 4px;display:flex;justify-content:space-between;gap:20px;align-items:center}.caption h2{font-size:21px;margin:0;font-weight:500}.caption p{color:var(--muted);margin:7px 0;font-size:11px}.caption .num{font-size:28px;color:var(--muted)}.end-card{flex:0 0 36vw;display:flex;justify-content:center;flex-direction:column;border:1px solid var(--line);padding:4vw;align-self:stretch}.end-card h2{font-size:clamp(32px,4vw,65px);font-weight:500;line-height:1.15;letter-spacing:-2px;margin:16px 0}.end-card p{font-size:13px;line-height:1.9;color:var(--muted)}.end-card button{padding:12px 0;text-align:left;color:var(--orange)}.bottom{padding:14px 4vw 22px;display:flex;gap:28px;align-items:center}.index{display:flex;gap:12px}.index button{padding:6px;color:var(--muted)}.index button.active{color:var(--orange)}.progress{height:1px;background:var(--line);flex:1}.progress i{display:block;background:var(--orange);height:1px;transform-origin:left;transform:scaleX(0)}.arrows{display:flex;gap:15px}.arrows button{font-size:23px}.hint{color:var(--muted);white-space:nowrap}.page{padding:40px 4vw 80px;animation:page-in .5s both}.page .back{font-size:13px;margin:0 0 35px;padding:8px 0}.page h1{font-size:clamp(38px,6vw,90px);line-height:1.12;font-weight:500;letter-spacing:-3px;margin:20px 0 32px}.project-intro{display:grid;grid-template-columns:1.4fr 1fr;gap:8vw;margin-bottom:45px}.project-intro p{font-size:17px;line-height:1.9;color:#c1c2c2;max-width:650px;margin:0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:22px;border-top:1px solid var(--line);padding-top:20px}.meta span{display:block;color:var(--muted);font-size:11px;margin-bottom:8px}.meta strong{font-size:13px;font-weight:400}.hero-video{width:100%;max-height:78dvh;background:#080808;display:block}.note{font-size:12px;color:var(--muted);margin:12px 0 50px}.story{display:grid;grid-template-columns:1fr 2fr;gap:5vw;border-top:1px solid var(--line);padding:30px 0 45px}.story h2{margin:0;font-size:21px;font-weight:500}.story p{margin:0;color:#c1c2c2;line-height:2;font-size:16px}.live{width:100%;display:block}.next{display:block;width:100%;text-align:left;margin-top:60px;padding:30px 0;border-top:1px solid var(--line);font-size:clamp(25px,4vw,55px)}.next span{display:block;font-size:11px;color:var(--muted);margin-bottom:18px}.studio{max-width:1000px;margin:auto}.studio p{font-size:22px;line-height:1.8;color:#bbb}.services{display:grid;grid-template-columns:1fr 1fr;margin:50px 0}.services div{border-top:1px solid var(--line);padding:24px 0}.services h2{font-weight:500;font-size:22px}.services p{font-size:14px}.empty{flex:0 0 65vw;border:1px solid var(--line);display:flex;justify-content:center;flex-direction:column;padding:5vw}.empty h2{font-weight:400;font-size:36px}.empty p{color:var(--muted);line-height:1.8}.empty button{color:var(--orange);text-align:left}.fade-in{animation:page-in .6s both}@keyframes page-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(max-width:700px){header{height:76px;padding:0 22px}.brand{font-size:20px}.brand span{display:none}.nav{gap:18px}.gallery{height:calc(100dvh - 76px)}.intro{padding:22px;align-items:start;flex-direction:column;gap:12px}.intro h1{font-size:28px}.track{padding-left:22px;padding-right:22px;gap:16px}.card{flex-basis:86vw}.caption h2{font-size:17px}.caption .num{font-size:20px}.image img{object-fit:cover}.image video{object-fit:contain}.tag{top:12px;left:12px}.open{width:38px;height:38px;right:12px;bottom:12px}.bottom{padding:8px 22px 20px;gap:10px}.hint{display:none}.end-card{flex-basis:80vw;padding:30px}.page{padding:25px 22px 60px}.page h1{letter-spacing:-1px}.project-intro,.story{grid-template-columns:1fr;gap:25px}.project-intro p{font-size:15px}.services{grid-template-columns:1fr}.studio p{font-size:17px}.empty{flex-basis:86vw}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.contact{display:flex;gap:48px;flex-wrap:wrap;margin-top:8px}.contact a{color:var(--orange);text-decoration:none}.contact p{margin:0;line-height:1.8}</style></head><body><header><a class="brand" href="#/">WINDWINGS<span>↗</span></a><nav class="nav"><button data-home>作品</button><button data-studio>关于 / 联系 ↗</button></nav></header><main id="app"></main>
<script>
const base='作品素材/';
const projects=[{slug:'xuliang-special-appearance',title:'徐良《友情出演》VJ',en:'SPECIAL APPEARANCE',category:'现场视觉',type:'舞台 VJ / 动态视觉',cover:base+'xuliang-special-appearance/cover.jpg',video:base+'xuliang-special-appearance/preview.mp4',live:base+'xuliang-special-appearance/live-cover.jpg',summary:'把歌曲的情绪转化为舞台上的动态视觉。',description:'粉色立体字、磁带与唱盘元素形成鲜明的视觉语言。横向构图围绕中央表演画面展开，让屏幕包装与现场演唱共同形成完整的观看体验。',thought:'从复古音乐媒介中提取视觉元素，以立体文字与明快色彩建立辨识度。中央画面保留表演焦点，两侧元素延展舞台空间。'}, {slug:'xuliang-concert',title:'徐良演唱会',en:'XULIANG CONCERT',category:'现场视觉',type:'演唱会视觉 / 舞台视觉',cover:base+'xuliang-special-appearance/cover.jpg',video:base+'xuliang-special-appearance/preview.mp4',summary:'演唱会现场视觉案例占位，广州站正式素材稍后更新。',description:'本条目为徐良演唱会现场视觉案例占位。现用公开预览素材临时展示，待广州站现场素材回收后替换为正式成片与现场呈现。',thought:'先以占位保留作品站结构与叙事位置；广州站结束后补齐正式视觉内容与现场画面。'}, {slug:'en-opening',title:'EN 开场影像',en:'OPENING FILM',category:'现场视觉',type:'开场影像 / 舞台视觉',cover:base+'en-opening/cover.jpg',video:base+'en-opening/preview.mp4',summary:'以光、海面与空间尺度建立开场氛围。',description:'暗色海面与远处的垂直光束构成画面的起点。流动质感、冷色调和明暗对比，将视线引向空间深处。',thought:'用开阔的空间和集中的光源建立视觉张力，让光成为观众进入演出情境的引导。'}];
const app=document.querySelector('#app'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let filter='全部',savedScroll=0,cleanup=()=>{};
function go(hash){if(location.hash===hash)render();else location.hash=hash}document.querySelector('[data-home]').onclick=()=>go('#/');document.querySelector('[data-studio]').onclick=()=>go('#/studio');
function gallery(){const rows=projects.filter(p=>filter==='全部'||p.category===filter);app.innerHTML=`<section class="gallery"><div class="intro"><div><h1>让创意，占据现场。</h1><p>舞台视觉 / 创意影像 / 品牌表达</p></div><div class="filters">${['全部','现场视觉','商业影像'].map(f=>`<button class="${f===filter?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div></div><div class="track">${rows.map((p,i)=>`<button class="card fade-in" data-slug="${p.slug}" aria-label="查看${p.title}详情"><div class="image"><img src="${p.live||p.cover}" alt="${p.title}作品画面" draggable="false"><video src="${p.video}" muted loop playsinline preload="none" tabindex="-1" aria-hidden="true"></video><span class="tag mono">${p.en}</span><span class="open">↗</span></div><div class="caption"><div><h2>${p.title}</h2><p>${p.type}</p></div><span class="num mono">0${i+1}</span></div></button>`).join('')}${rows.length?`<div class="end-card"><span class="mono">WINDWINGS / STUDIO</span><h2>下一个现场，<br>一起创造。</h2><p>从舞台到品牌，从视觉概念到动态影像。<br>让创意成为可被看见的体验。</p><button data-studio>了解风翮 ↗</button></div>`:`<div class="empty"><span class="mono">COMMERCIAL / COMING SOON</span><h2>商业影像作品，正在整理。</h2><p>品牌 TVC、游戏宣传片等案例将在素材补齐后更新。</p><button data-reset>查看现场视觉 →</button></div>`}</div><footer class="bottom"><div class="index">${rows.map((p,i)=>`<button data-index="${i}" aria-label="跳到${p.title}">0${i+1}</button>`).join('')}</div><div class="progress"><i></i></div><span class="hint mono">滚动 / 拖动浏览 →</span><div class="arrows"><button data-prev aria-label="上一个作品">←</button><button data-next aria-label="下一个作品">→</button></div></footer></section>`;
const track=app.querySelector('.track'),cards=[...app.querySelectorAll('.card')],bar=app.querySelector('.progress i');let active=0,drag=null,moved=false,suppressClick=false;
function update(){savedScroll=track.scrollLeft;const max=track.scrollWidth-track.clientWidth;bar.style.transform=`scaleX(${max>0?track.scrollLeft/max:1})`;let idx=cards.length-1;if(track.scrollLeft<max-3){let min=Infinity;cards.forEach((c,i)=>{let dist=Math.abs(c.offsetLeft-track.offsetLeft-track.scrollLeft-parseFloat(getComputedStyle(track).paddingLeft));if(dist<min){min=dist;idx=i}})}active=Math.max(0,idx);app.querySelectorAll('[data-index]').forEach((b,i)=>b.classList.toggle('active',i===active))}function jump(i){if(!cards.length)return;i=Math.max(0,Math.min(cards.length-1,i));track.scrollTo({left:cards[i].offsetLeft-track.offsetLeft-parseFloat(getComputedStyle(track).paddingLeft),behavior:reduce?'instant':'smooth'})}
track.addEventListener('scroll',update,{passive:true});track.addEventListener('wheel',e=>{if(e.ctrlKey||Math.abs(e.deltaX)>=Math.abs(e.deltaY))return;const dir=e.deltaY;const max=track.scrollWidth-track.clientWidth;if((dir>0&&track.scrollLeft>=max-1)||(dir<0&&track.scrollLeft<=0))return;e.preventDefault();track.scrollLeft+=dir*(e.deltaMode===1?20:1)},{passive:false});
track.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;drag={x:e.clientX,scroll:track.scrollLeft};moved=false;suppressClick=false});function move(e){if(!drag)return;if(Math.abs(e.clientX-drag.x)>6){moved=true;suppressClick=true;track.classList.add('dragging');track.scrollLeft=drag.scroll-(e.clientX-drag.x)}}function up(){drag=null;track.classList.remove('dragging');if(suppressClick)setTimeout(()=>suppressClick=false,0)}window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
cards.forEach(c=>{c.onclick=()=>{if(!suppressClick)go('#/work/'+c.dataset.slug)};let v=c.querySelector('video');c.onmouseenter=()=>{if(!reduce)v.play().catch(()=>{})};c.onmouseleave=()=>{v.pause()};c.onfocus=()=>{if(!reduce)v.play().catch(()=>{})};c.onblur=()=>v.pause()});
const observer=new IntersectionObserver(es=>es.forEach(e=>{let v=e.target.querySelector('video');if(!e.isIntersecting){v.pause();e.target.classList.remove('playing')}else if(innerWidth<=700&&!reduce){v.play().then(()=>e.target.classList.add('playing')).catch(()=>{})}}),{root:track,threshold:.65});cards.forEach(c=>observer.observe(c));
app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;savedScroll=0;render()});app.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>jump(+b.dataset.index));app.querySelector('[data-prev]').onclick=()=>jump(active-1);app.querySelector('[data-next]').onclick=()=>jump(active+1);app.querySelector('[data-studio]')?.addEventListener('click',()=>go('#/studio'));app.querySelector('[data-reset]')?.addEventListener('click',()=>{filter='现场视觉';render()});function key(e){if(e.target.closest('button,a,input'))return;if(e.key==='ArrowRight'){e.preventDefault();jump(active+1)}if(e.key==='ArrowLeft'){e.preventDefault();jump(active-1)}}window.addEventListener('keydown',key);track.scrollLeft=savedScroll;update();cleanup=()=>{observer.disconnect();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('keydown',key);cards.forEach(c=>c.querySelector('video').pause())};}
function detail(p){let next=projects[(projects.indexOf(p)+1)%projects.length];app.innerHTML=`<article class="page"><button class="back" data-back>← 返回作品</button><div class="mono">${p.en} / ${p.category}</div><h1>${p.title}</h1><div class="project-intro"><p>${p.summary}<br>${p.description}</p><div class="meta"><div><span>项目类型</span><strong>${p.type}</strong></div><div><span>工作室</span><strong>WINDWINGS 风翮视觉</strong></div></div></div><video class="hero-video" controls playsinline preload="metadata" poster="${p.cover}" src="${p.video.replace('preview.mp4','film.mp4')}"></video><p class="note">完整作品 · 点击播放</p><section class="story"><h2>视觉思路</h2><p>${p.thought}</p></section>${p.live?`<img class="live" src="${p.live}" alt="徐良演唱会现场大屏效果"><p class="note">现场呈现</p>`:''}<button class="next" data-next-project><span class="mono">NEXT PROJECT ↗</span>${next.title} →</button></article>`;app.querySelector('[data-back]').onclick=()=>go('#/');app.querySelector('[data-next-project]').onclick=()=>go('#/work/'+next.slug);cleanup=()=>app.querySelector('video')?.pause()}
function studio(){app.innerHTML=`<article class="page studio"><button class="back" data-back>← 返回作品</button><span class="mono">ABOUT / WINDWINGS</span><h1>创意有锋芒，<br>视觉有现场。</h1><p>风翮视觉是一家专注于现场视觉与商业影像的视觉设计创意公司。我们围绕舞台、屏幕与品牌，探索具有辨识度的视觉表达。</p><div class="services"><div><span class="mono">01 / LIVE VISUALS</span><h2>现场视觉</h2><p>舞台视觉设计、现场宣传片、大屏 VJ、品牌创意。</p></div><div><span class="mono">02 / COMMERCIAL FILMS</span><h2>商业影像</h2><p>品牌 TVC、游戏宣传片与商业项目视觉设计。</p></div></div><h2>一起创造下一个项目。</h2><div class="contact"><p><span class="mono">EMAIL</span><br><a href="mailto:Jp404685320@gmail.com">Jp404685320@gmail.com</a></p><p><span class="mono">WECHAT</span><br>windwingslab</p></div></article>`;app.querySelector('[data-back]').onclick=()=>go('#/')}
function render(){cleanup();cleanup=()=>{};window.scrollTo(0,0);const hash=location.hash||'#/';if(hash==='#/studio')studio();else if(hash.startsWith('#/work/')){let p=projects.find(p=>p.slug===hash.slice(7));p?detail(p):gallery()}else gallery()}window.addEventListener('hashchange',render);render();
</script></body></html>
